# Publishes this n8n community node package to npm when a version tag
# (v0.2.0 or 0.2.0) is pushed. n8n requires community nodes to be published
# from GitHub Actions with npm provenance; this workflow does that.
#
# `npm run release` is used instead of `npm publish --provenance` because the
# package's `prepublishOnly` (n8n-node prerelease) refuses a bare
# `npm publish`. In CI, `n8n-node release` runs lint and build, then
# `npm publish` with NPM_CONFIG_PROVENANCE=true.

name: Publish

on:
  push:
    tags:
      # Matches v0.2.0, 0.2.0, v1.0.0-rc.1, etc.
      - 'v*.*.*'
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Uses npm trusted publishing (OIDC) unless an NPM_TOKEN secret is set.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_ACCESS: public
